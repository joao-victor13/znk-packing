version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. BANCO DE DADOS RELACIONAL: PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: znk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-znk_fashion_erp}
      POSTGRES_USER: ${POSTGRES_USER:-znk_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - znk_internal_net
    # Acesso isolado internamente; NÃO exposto publicamente na porta do host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-znk_admin} -d ${POSTGRES_DB:-znk_fashion_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  # ----------------------------------------------------------------------------
  # 2. APLICAÇÃO: Node.js / Next.js / React (ZNK Atelier ERP)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: znk_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-znk_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-znk_fashion_erp}?schema=public&sslmode=prefer
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET}
      APP_URL: ${APP_URL:-https://compras.znkatelier.com.br}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - znk_internal_net
    # Exposto apenas na rede interna do Docker (porta 3000)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  # ----------------------------------------------------------------------------
  # 3. REVERSE PROXY & SSL TERMINATION: Nginx Alpine
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: znk_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"   # HTTP (Redirecionamento 301 para HTTPS + Let's Encrypt challenge)
      - "443:443" # HTTPS (Tráfego seguro com TLS 1.3 / HTTP/2)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - znk_internal_net

  # ----------------------------------------------------------------------------
  # 4. CERTIFICADOS SSL/TLS: Let's Encrypt / Certbot Auto-Renewal
  # ----------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: znk_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Checa e renova certificados a cada 12 horas automaticamente
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - znk_internal_net

# ------------------------------------------------------------------------------
# VOLUMES PERSISTENTES EM DISCO
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local

# ------------------------------------------------------------------------------
# REDE BRIDGE PRIVADA ISOLADA
# ------------------------------------------------------------------------------
networks:
  znk_internal_net:
    driver: bridge
